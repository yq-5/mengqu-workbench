  --shadow:0 6px 20px rgba(255,107,157,0.10);
  --shadow-card:0 4px 14px rgba(165,94,234,0.08);
  --shadow-pop:0 8px 24px rgba(84,160,255,0.18);
  --sidebar-w:220px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Nunito','ZCOOL KuaiLe',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);user-select:none;-webkit-user-select:none;
}
.zcool{font-family:'ZCOOL KuaiLe',sans-serif}

/* ============ App 外壳 ============ */
.app-shell{width:100%;height:100vh;display:flex;flex-direction:column;position:relative}

/* ============ 手机外框（移动端） ============ */
.phone-frame{
  width:100%;max-width:440px;height:100%;margin:0 auto;
  background:var(--bg);position:relative;display:flex;flex-direction:column;
  overflow:hidden;flex:1;
}
/* 状态栏 */
.status-bar{
  height:calc(28px + var(--safe-top));display:flex;align-items:flex-end;
  justify-content:space-between;padding:0 20px var(--safe-top);
  font-size:12px;font-weight:800;color:var(--ink);flex-shrink:0;padding-bottom:4px;
}
.status-bar .icons{display:flex;gap:4px;align-items:center;font-size:10px}
/* 主区域 */
.app-main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.app-main::-webkit-scrollbar{width:0;display:none}
.page{display:none;animation:fadeUp .35s ease}
.page.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* ============ 通用组件 ============ */
.page-pad{padding:0 16px calc(100px + var(--safe-bottom))}
.page-title{font-family:'ZCOOL KuaiLe';font-size:24px;color:var(--ink);margin:8px 0 4px;display:flex;align-items:center;gap:8px}
.page-title .emoji{font-size:26px}
.page-sub{font-size:12px;color:var(--ink-s);margin-bottom:16px;font-weight:700}
.card{background:var(--card);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow-card);margin-bottom:14px}
.card-title{font-family:'ZCOOL KuaiLe';font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:6px}
.btn{border:none;border-radius:var(--radius-s);padding:10px 18px;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;transition:transform .15s,box-shadow .15s;display:inline-flex;align-items:center;gap:6px}
.btn:active{transform:scale(.94)}
.btn-primary{background:linear-gradient(135deg,var(--pink),var(--orange));color:#fff;box-shadow:0 4px 12px rgba(255,107,157,.35)}
.btn-blue{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff}
.btn-green{background:linear-gradient(135deg,var(--green),var(--teal));color:#fff}
.btn-ghost{background:var(--bg);color:var(--ink-s)}
.tag{display:inline-flex;align-items:center;gap:3px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:800;white-space:nowrap}
.chip{padding:7px 16px;border-radius:20px;font-size:13px;font-weight:800;white-space:nowrap;cursor:pointer;transition:.2s;border:2px solid transparent}
.chip.active{color:#fff;transform:scale(1.05)}
.stars{font-size:12px;letter-spacing:1px}
.checkbox{width:24px;height:24px;border-radius:8px;border:3px solid var(--blue-l);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.2s;background:#fff}
.checkbox.done{background:linear-gradient(135deg,var(--green),var(--teal));border-color:var(--green)}
.checkbox.done::after{content:'✓';color:#fff;font-weight:900;font-size:14px}

/* ============ 底部Tab ============ */
.tab-bar{
  height:calc(68px + var(--safe-bottom));display:flex;background:#fff;
  border-top:2px solid var(--line);flex-shrink:0;position:relative;z-index:10;
  box-shadow:0 -4px 20px rgba(165,94,234,0.08);padding-bottom:var(--safe-bottom);
}
.tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;transition:.2s;color:var(--ink-l);font-weight:800;font-size:10px;position:relative;height:68px}
.tab-item .tab-icon{width:30px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;transition:.25s}
.tab-item.active{color:var(--pink)}
.tab-item.active .tab-icon{background:linear-gradient(135deg,var(--pink-ll),var(--orange-l));transform:translateY(-4px) scale(1.15);box-shadow:0 4px 12px rgba(255,107,157,.3)}
.tab-item.active::before{content:'';position:absolute;top:0;width:24px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--pink),var(--orange))}

/* ============ 统计卡片 ============ */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.stat-card{border-radius:var(--radius);padding:14px 16px;color:#fff;position:relative;overflow:hidden;box-shadow:var(--shadow-card);min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.stat-card .stat-label{font-size:12px;font-weight:800;opacity:.92;display:flex;align-items:center;gap:4px}
.stat-card .stat-num{font-family:'ZCOOL KuaiLe';font-size:34px;line-height:1}
.stat-card .stat-extra{font-size:11px;opacity:.85;font-weight:700}
.stat-card .stat-deco{position:absolute;right:-8px;bottom:-12px;font-size:56px;opacity:.18;transform:rotate(-12deg)}
.sc-pink{background:linear-gradient(135deg,#FF6B9D,#FF9F43)}
.sc-blue{background:linear-gradient(135deg,#54A0FF,#00D2D3)}
.sc-green{background:linear-gradient(135deg,#1DD1A1,#54A0FF)}
.sc-purple{background:linear-gradient(135deg,#A55EEA,#FF6B9D)}

/* ============ 任务项 ============ */
.task-item{display:flex;align-items:center;gap:12px;padding:12px;border-radius:var(--radius-s);background:var(--card);margin-bottom:10px;box-shadow:var(--shadow-card);transition:.2s;border-left:4px solid var(--blue-l)}
.task-item.done{opacity:.55}
.task-item.done .task-name{text-decoration:line-through;color:var(--ink-l)}
.task-item.overdue{border-left-color:var(--red)}
.task-item .task-main{flex:1;min-width:0}
.task-name{font-weight:800;font-size:14px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.task-meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-s);flex-wrap:wrap}
.task-cat{padding:2px 8px;border-radius:10px;font-size:10px;font-weight:800;color:#fff}
.cat-work{background:var(--blue)}.cat-self{background:var(--green)}.cat-read{background:var(--orange)}.cat-sport{background:var(--red)}.cat-exam{background:var(--purple)}.cat-custom{background:var(--teal)}
.task-actions{display:flex;flex-direction:column;gap:4px}
.task-actions .ta{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;background:var(--bg);transition:.15s}
.task-actions .ta:active{transform:scale(.85)}

/* ============ 热力图 ============ */
.heat-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin-top:8px}
.heat-cell{aspect-ratio:1;border-radius:6px;background:var(--line);cursor:pointer;transition:.2s;position:relative}
.heat-cell:hover{transform:scale(1.2);z-index:2}
.heat-0{background:#F0EBE3}.heat-1{background:#FFE4EE}.heat-2{background:#FFC2D9}.heat-3{background:#FF9FC2}.heat-4{background:var(--pink)}
.heat-legend{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--ink-s);margin-top:10px;justify-content:flex-end;font-weight:700}
.heat-legend .lc{width:12px;height:12px;border-radius:3px}
.streak-box{display:flex;gap:10px;margin-top:12px}
.streak-pill{flex:1;background:linear-gradient(135deg,var(--orange-l),var(--yellow-l));border-radius:var(--radius-s);padding:12px;text-align:center}
.streak-pill .sp-num{font-family:'ZCOOL KuaiLe';font-size:28px;color:var(--orange)}
.streak-pill .sp-label{font-size:11px;color:var(--ink-s);font-weight:800}

/* ============ 弹窗 ============ */
.modal-mask{position:fixed;inset:0;background:rgba(58,56,69,.5);backdrop-filter:blur(4px);display:none;align-items:flex-end;justify-content:center;z-index:100}
.modal-mask.show{display:flex;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-sheet{width:100%;max-width:440px;background:#fff;border-radius:28px 28px 0 0;padding:20px;padding-bottom:calc(20px + var(--safe-bottom));max-height:85vh;overflow-y:auto;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
.modal-sheet::-webkit-scrollbar{display:none}
.modal-handle{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 16px}
.modal-title{font-family:'ZCOOL KuaiLe';font-size:20px;text-align:center;margin-bottom:16px}
.form-group{margin-bottom:14px}
.form-label{font-size:12px;font-weight:800;color:var(--ink-s);margin-bottom:6px;display:block}
.form-input{width:100%;padding:12px 14px;border:2px solid var(--line);border-radius:var(--radius-s);font-size:14px;font-family:inherit;font-weight:700;background:var(--bg);color:var(--ink)}
.form-input:focus{outline:none;border-color:var(--pink);background:#fff}
.form-row{display:flex;gap:10px}
.form-row>*{flex:1}

/* ============ 语种切换 ============ */
.lang-tabs{display:flex;gap:8px;margin-bottom:16px}
.lang-tab{flex:1;padding:12px 8px;border-radius:var(--radius-s);text-align:center;cursor:pointer;font-weight:900;font-size:13px;transition:.25s;background:var(--card);color:var(--ink-s);box-shadow:var(--shadow-card);border:2px solid transparent}
.lang-tab .lt-flag{font-size:24px;display:block;margin-bottom:4px}
.lang-tab.active{color:#fff;transform:translateY(-3px)}
.lang-tab.active[data-lang="en"]{background:linear-gradient(135deg,var(--blue),var(--teal))}
.lang-tab.active[data-lang="ja"]{background:linear-gradient(135deg,var(--pink),var(--red))}
.lang-tab.active[data-lang="ko"]{background:linear-gradient(135deg,var(--purple),var(--blue))}
.lang-sub-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px}
.lang-sub-tabs::-webkit-scrollbar{display:none}
.word-card{background:linear-gradient(135deg,var(--blue-ll),var(--purple-ll));border-radius:var(--radius);padding:18px;margin-bottom:12px;position:relative;overflow:hidden}
.word-card .wc-word{font-family:'Nunito';font-size:26px;font-weight:900;color:var(--purple);margin-bottom:4px}
.word-card .wc-phonetic{font-size:13px;color:var(--ink-s);font-weight:700;margin-bottom:8px}
.word-card .wc-meaning{font-size:15px;font-weight:800;color:var(--ink)}
.word-card.ja{background:linear-gradient(135deg,var(--pink-ll),var(--orange-l))}
.word-card.ja .wc-word{color:var(--red)}
.word-card.ko{background:linear-gradient(135deg,var(--purple-ll),var(--blue-ll))}
.word-card.ko .wc-word{color:var(--blue)}

/* ============ 亲子 ============ */
.kid-banner{border-radius:var(--radius);padding:16px;color:#fff;position:relative;overflow:hidden;margin-bottom:14px}
.kid-banner .kb-avatar{font-size:48px}
.kid-banner .kb-name{font-family:'ZCOOL KuaiLe';font-size:22px}
.kid-banner .kb-info{font-size:12px;opacity:.9;font-weight:700}
.kid-switch{display:flex;gap:8px;overflow-x:auto;padding-bottom:10px}
.kid-switch::-webkit-scrollbar{display:none}
.kid-pill{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:20px;background:#fff;box-shadow:var(--shadow-card);font-weight:800;font-size:13px;cursor:pointer;white-space:nowrap;border:2px solid transparent;transition:.2s}
.kid-pill.active{border-color:var(--orange);background:var(--orange-ll)}
.growth-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.growth-row:last-child{border:none}
.growth-row .gr-label{font-size:13px;font-weight:800;color:var(--ink-s)}
.growth-row .gr-val{font-family:'ZCOOL KuaiLe';font-size:18px;color:var(--pink)}

/* ============ 记账 ============ */
.balance-card{border-radius:var(--radius);padding:18px;color:#fff;position:relative;overflow:hidden;margin-bottom:14px;background:linear-gradient(135deg,#A55EEA,#6C5CE7)}
.balance-card .bc-label{font-size:12px;opacity:.85;font-weight:800}
.balance-card .bc-num{font-family:'ZCOOL KuaiLe';font-size:32px;margin:4px 0}
.balance-card .bc-row{display:flex;gap:16px;margin-top:10px}
.balance-card .bc-item{flex:1;background:rgba(255,255,255,.15);border-radius:12px;padding:8px 10px}
.balance-card .bc-item .bci-label{font-size:10px;opacity:.85}
.balance-card .bc-item .bci-num{font-size:16px;font-weight:900}
.balance-card .bc-deco{position:absolute;right:-10px;top:-10px;font-size:72px;opacity:.12}
.cat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cat-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:var(--radius-s);background:var(--card);box-shadow:var(--shadow-card);cursor:pointer;transition:.2s;font-size:11px;font-weight:800;color:var(--ink-s)}
.cat-btn:active{transform:scale(.92)}
.cat-btn.active{background:var(--pink-ll);color:var(--pink)}
.cat-btn .cb-icon{width:40px;height:40px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff}
.cb-food{background:var(--orange)}.cb-transport{background:var(--blue)}.cb-shop{background:var(--pink)}.cb-medical{background:var(--red)}.cb-edu{background:var(--purple)}.cb-fun{background:var(--teal)}.cb-social{background:var(--yellow);color:var(--ink)}.cb-other{background:var(--ink-s)}.cb-salary{background:var(--green)}.cb-bonus{background:var(--teal)}.cb-parttime{background:var(--blue)}.cb-finance{background:var(--purple)}.cb-redpacket{background:var(--red)}
.goal-item{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;box-shadow:var(--shadow-card)}
.goal-item .gi-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.goal-item .gi-name{font-weight:900;font-size:15px;display:flex;align-items:center;gap:6px}
.goal-item .gi-pct{font-family:'ZCOOL KuaiLe';font-size:18px;color:var(--green)}
.progress-bar{height:12px;background:var(--line);border-radius:6px;overflow:hidden;position:relative}
.progress-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--green),var(--teal));transition:width .6s;position:relative}
.progress-fill::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.4),transparent);animation:shimmer 2s infinite}
@keyframes shimmer{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.goal-item .gi-bottom{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--ink-s);font-weight:700}

/* ============ 我的 ============ */
.profile-header{background:linear-gradient(135deg,var(--purple),var(--pink));border-radius:var(--radius-l);padding:24px 20px;color:#fff;text-align:center;margin-bottom:16px;position:relative;overflow:hidden}
.profile-header .ph-avatar{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 10px;border:3px solid rgba(255,255,255,.4)}
.profile-header .ph-name{font-family:'ZCOOL KuaiLe';font-size:22px}
.profile-header .ph-sub{font-size:12px;opacity:.85;font-weight:700;margin-top:4px}
.profile-header .ph-deco{position:absolute;font-size:80px;opacity:.1}
.profile-header .ph-deco.l{left:-10px;top:-10px;transform:rotate(-20deg)}
.profile-header .ph-deco.r{right:-10px;bottom:-15px;transform:rotate(15deg)}
.menu-list{background:#fff;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow-card);margin-bottom:14px}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;transition:.15s;border-bottom:1px solid var(--line)}
.menu-item:last-child{border:none}
.menu-item:active{background:var(--bg)}
.menu-item .mi-icon{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;flex-shrink:0}
.menu-item .mi-label{flex:1;font-weight:800;font-size:14px}
.menu-item .mi-arrow{color:var(--ink-l);font-size:12px}
.medal-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.medal{aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:28px;position:relative;background:var(--bg);border:3px solid var(--line)}
.medal.unlocked{background:linear-gradient(135deg,var(--yellow-l),var(--orange-l));border-color:var(--yellow)}
.medal.locked{opacity:.4;filter:grayscale(1)}
.medal .m-name{font-size:9px;font-weight:800;color:var(--ink-s);margin-top:2px}

/* ============ 全局日历 ============ */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cal-head{text-align:center;font-size:11px;font-weight:800;color:var(--ink-s);padding:4px 0}
.cal-day{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:800;cursor:pointer;position:relative;background:var(--bg);transition:.15s}
.cal-day:active{transform:scale(.9)}
.cal-day.today{background:var(--pink);color:#fff}
.cal-day.has-task::after{content:'';position:absolute;bottom:3px;width:5px;height:5px;border-radius:50%;background:var(--green)}
.cal-day.today.has-task::after{background:#fff}
.cal-day.other{opacity:.35}

/* ============ Toast ============ */
.toast{position:fixed;top:calc(50px + var(--safe-top));left:50%;transform:translateX(-50%) translateY(-80px);background:var(--ink);color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;font-weight:800;z-index:200;transition:.35s;opacity:0;pointer-events:none;max-width:90%;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ============ FAB ============ */
.fab{position:fixed;right:18px;bottom:calc(82px + var(--safe-bottom));width:54px;height:54px;border-radius:50%;background:linear-gradient(135deg,var(--pink),var(--orange));color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:20;box-shadow:0 6px 18px rgba(255,107,157,.45);transition:.2s;border:none}
.fab:active{transform:scale(.9) rotate(90deg)}

/* ============ 其他 ============ */
.empty{text-align:center;padding:40px 20px;color:var(--ink-l)}
.empty .emoji{font-size:48px;display:block;margin-bottom:8px}
.empty .text{font-size:13px;font-weight:700}
.ring-wrap{display:flex;justify-content:center;padding:10px}
.ring{width:100px;height:100px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ring-num .rn-big{font-family:'ZCOOL KuaiLe';font-size:24px;color:var(--pink)}
.ring .ring-num .rn-sm{font-size:10px;color:var(--ink-s);font-weight:700}

/* ============ 侧边栏（平板/桌面） ============ */
.sidebar{display:none;flex-direction:column;width:var(--sidebar-w);background:linear-gradient(180deg,#fff,var(--bg));border-right:2px solid var(--line);position:fixed;top:0;left:0;height:100vh;z-index:50;padding:calc(20px + var(--safe-top)) 12px 12px}
.sidebar-logo{font-family:'ZCOOL KuaiLe';font-size:20px;text-align:center;padding:12px 8px 20px;color:var(--pink);border-bottom:2px dashed var(--line);margin-bottom:16px}
.sidebar-nav{flex:1;display:flex;flex-direction:column;gap:6px}
.sidebar-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--radius-s);cursor:pointer;font-weight:800;font-size:15px;color:var(--ink-s);transition:.2s}
.sidebar-item:hover{background:var(--pink-ll)}
.sidebar-item.active{background:linear-gradient(135deg,var(--pink),var(--orange));color:#fff;box-shadow:0 4px 12px rgba(255,107,157,.3)}
.sidebar-item .si-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;background:var(--bg)}
.sidebar-item.active .si-icon{background:rgba(255,255,255,.25)}
.sidebar-footer{padding:12px;text-align:center;font-size:11px;color:var(--ink-l);font-weight:700}

/* ============ 安装提示横幅 ============ */
.install-banner{position:fixed;bottom:calc(78px + var(--safe-bottom));left:12px;right:12px;background:linear-gradient(135deg,var(--purple),var(--pink));color:#fff;border-radius:var(--radius);padding:14px 16px;display:none;align-items:center;gap:12px;z-index:30;box-shadow:0 6px 20px rgba(165,94,234,.3);animation:fadeUp .4s}
.install-banner.show{display:flex}
.install-banner .ib-icon{font-size:32px}
.install-banner .ib-text{flex:1}
.install-banner .ib-title{font-weight:900;font-size:14px}
.install-banner .ib-sub{font-size:11px;opacity:.9}
.install-banner .ib-btn{background:#fff;color:var(--pink);padding:8px 16px;border-radius:12px;font-weight:900;font-size:13px;border:none;cursor:pointer}
.install-banner .ib-close{background:rgba(255,255,255,.2);color:#fff;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;font-size:16px}

function loadDB(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY);
    if(raw){DB=JSON.parse(raw);return;}
  }catch(e){console.warn('数据加载失败',e)}
  DB=getDefaultData();
  saveDB();
}
let _saveTimer=null;
function saveDB(){
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify(DB))}catch(e){console.warn('保存失败',e)}
  },300);
}

// ============ 工具函数 ============
const $=s=>document.querySelector(s);
const $$=s=>document.querySelectorAll(s);
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800)}
function goPage(name){
  $$('.page').forEach(p=>p.classList.remove('active'));
  $('#page-'+name).classList.add('active');
  $$('.tab-item').forEach(t=>t.classList.toggle('active',t.dataset.page===name));
  $$('.sidebar-item').forEach(t=>t.classList.toggle('active',t.dataset.page===name));
  $('#appMain').scrollTop=0;
  updateFab(name);
}
function updateFab(name){$('#fab').style.display=name==='profile'?'none':'flex';$('#fab').textContent='+'}
function closeModal(){$('#modalMask').classList.remove('show')}
$('#modalMask').addEventListener('click',e=>{if(e.target===$('#modalMask'))closeModal()});
function onFabClick(){
  const active=$('.tab-item.active').dataset.page;
  if(active==='home')openTaskModal();
  else if(active==='lang')openWordModal();
  else if(active==='kid')openKidTaskModal();
  else if(active==='money')openAccountModal();
}

// ============ 时钟 & 问候 ============
function updateClock(){
  const d=new Date();const h=String(d.getHours()).padStart(2,'0');const m=String(d.getMinutes()).padStart(2,'0');
  const clockEl=$('#clock');if(clockEl)clockEl.textContent=h+':'+m;
  const hr=d.getHours();let g='早上好呀～元气满满的一天！';
  if(hr>=11&&hr<14)g='中午好～记得吃午饭哦！';
  else if(hr>=14&&hr<18)g='下午好～继续冲鸭！';
  else if(hr>=18&&hr<23)g='晚上好～今天辛苦啦！';
  else if(hr>=23||hr<6)g='夜深啦～早点休息哦';
  const ge=$('#greetText');if(ge)ge.textContent=g;
}

function renderStats(){
  const t=DB.tasks,total=t.length,done=t.filter(x=>x.done).length,pending=t.filter(x=>!x.done).length;
  const rate=total>0?(done/total*100).toFixed(1):0;
  $('#stTotal').textContent=total;$('#stDone').textContent=done;$('#stPending').textContent=pending;$('#stRate').textContent=rate+'%';
  let extra='继续加油～';
  if(rate==100)extra='全部完成！太棒啦🎉';else if(rate>=80)extra='快完成啦！';else if(rate>=50)extra='过半啦，加油！';else if(rate>0)extra='开始就成功一半！';else extra='开始你的第一步';
  $('#stRateExtra').textContent=extra;
}
function renderTasks(){
  let list=DB.tasks.slice();
  if(DB.filter==='pending')list=list.filter(t=>!t.done);
  else if(DB.filter==='done')list=list.filter(t=>t.done);
  else if(DB.filter==='overdue')list=list.filter(t=>t.overdue);
  if(DB.cat!=='all')list=list.filter(t=>t.cat===DB.cat);
  const box=$('#taskList');
  if(list.length===0){box.innerHTML='<div class="empty"><span class="emoji">🍭</span><div class="text">还没有任务，点右下角＋添加吧</div></div>';return}
  box.innerHTML=list.map(t=>{
    const[cl,cc]=CAT_MAP[t.cat]||['✨','cat-custom'];
    return`<div class="task-item ${t.done?'done':''} ${t.overdue&&!t.done?'overdue':''}">
      <div class="checkbox ${t.done?'done':''}" onclick="toggleTask(${t.id})"></div>
      <div class="task-main"><div class="task-name">${t.overdue&&!t.done?'⏰':''}${t.name}</div>
      <div class="task-meta"><span class="task-cat ${cc}">${cl}</span><span class="stars"><span class="on">${'★'.repeat(t.stars)}</span><span class="off">${'☆'.repeat(5-t.stars)}</span></span><span>🕐 ${t.ddl}</span><span>🔁 ${t.repeat}</span>${t.note?`<span>📎 ${t.note}</span>`:''}</div></div>
      <div class="task-actions"><div class="ta" style="color:var(--blue)" onclick="delayTask(${t.id})">⏭️</div><div class="ta" style="color:var(--red)" onclick="delTask(${t.id})">🗑️</div></div></div>`;
  }).join('');
}

function toggleTask(id){const t=DB.tasks.find(x=>x.id===id);if(t){t.done=!t.done;t.overdue=false;saveDB();renderTasks();renderStats();toast(t.done?'完成啦！🎉':'已取消完成')}}
function delayTask(id){const t=DB.tasks.find(x=>x.id===id);if(t){t.overdue=false;t.ddl='明天 '+t.ddl.replace(/.*\s/,'');saveDB();renderTasks();renderStats();toast('已延后到明天～')}}

function getPracticeQuestions(lang,type){
  if(lang==='en'){
    if(type==='完形填空')return[{q:'The ___ discovery of penicillin changed medicine forever.',options:['accidental','intentional','harmful','boring'],correct:0}];
    if(type==='选词填空')return[{q:'Choose: She is very ___ in solving puzzles.',options:['skillful','skilled','skill','skills'],correct:1}];
    if(type==='短句跟读')return[{q:'Repeat after me: "I\'m looking forward to meeting you."',options:['🎤 开始录音','🔊 听标准发音','📝 查看解析','⏭️ 下一题'],correct:0}];
    if(type==='阅读理解')return[{q:'What is the main idea of the passage?',options:['Technology benefits','Environmental protection','Space exploration','History of art'],correct:0}];
  }else if(lang==='ja'){
    if(type==='文法专项')return[{q:'「行く」のて形は？',options:['行って','行いて','行たて','行だて'],correct:0}];
    if(type==='日语汉字注释')return[{q:'「日本」の「日」の音読みは？',options:['にち','ひ','に','じつ'],correct:0}];
    if(type==='日文短句朗读')return[{q:'朗读：「おはようございます」',options:['🎤 开始录音','🔊 听发音','📝 查看意思','⏭️ 下一题'],correct:0}];
    if(type==='听力练习')return[{q:'听力：今天天气怎么样？',options:['いい天気です','雨です','雪です','曇りです'],correct:0}];
  }else{
    if(type==='TOPIK 初级词汇')return[{q:'"사랑"의 뜻은？',options:['사랑','우정','행복','슬픔'],correct:0}];
    if(type==='韩剧实用短句')return[{q:'《鬼怪》名台词："오늘은 겨울의 첫눈이 내리는 날" 意思是？',options:['今天是初雪日','今天很热','明天见','晚安'],correct:0}];
    if(type==='敬语语法')return[{q:'"먹다"의 높임말은？',options:['드시다','먹으시다','잡수시다','A와 C'],correct:3}];
    if(type==='听力练习')return[{q:'听力：주말에 뭐 해요?',options:['공부해요','잘 자요','안녕하세요','감사합니다'],correct:0}];
  }
  return[{q:'开始'+type+'练习吧！',options:['选项A','选项B','选项C','选项D'],correct:0}];
}
function checkPracticeAnswer(btn,idx,correct){
  const all=$('#practiceOptions').querySelectorAll('button');
  all.forEach((b,i)=>{b.disabled=true;b.style.opacity='0.6';if(i===correct){b.style.background='var(--green-ll)';b.style.color='var(--green)';b.style.borderColor='var(--green)';b.innerHTML+=' ✓'}});
  const fb=$('#practiceFeedback');fb.style.display='block';
  if(idx===correct){fb.style.color='var(--green)';fb.innerHTML='🎉 回答正确！';
    // 记录练习进度（简单示例）
    toast('回答正确，学习进度+1💪');
  }else{btn.style.background='var(--red-ll)';btn.style.color='var(--red)';btn.style.borderColor='var(--red)';btn.innerHTML+=' ✗';fb.style.color='var(--red)';fb.innerHTML='❌ 再想想看～';}
}

function renderPie(){
  const data=[{n:'餐饮',v:2100,c:'#FF9F43'},{n:'购物',v:1800,c:'#FF6B9D'},{n:'教育',v:1500,c:'#A55EEA'},{n:'交通',v:800,c:'#54A0FF'},{n:'娱乐',v:700,c:'#00D2D3'},{n:'医疗',v:500,c:'#EE5253'},{n:'人情',v:500,c:'#FECA57'},{n:'其他',v:319,c:'#6B6878'}];
  const total=data.reduce((s,d)=>s+d.v,0);let cum=0,paths='';
  data.forEach(d=>{const start=cum/total*360,end=(cum+d.v)/total*360;const r1=start*Math.PI/180,r2=end*Math.PI/180;const x1=100+80*Math.cos(r1-90*Math.PI/180),y1=100+80*Math.sin(r1-90*Math.PI/180);const x2=100+80*Math.cos(r2-90*Math.PI/180),y2=100+80*Math.sin(r2-90*Math.PI/180);const large=end-start>180?1:0;paths+=`<path d="M100,100 L${x1},${y1} A80,80 0 ${large} 1 ${x2},${y2} Z" fill="${d.c}" stroke="#fff" stroke-width="2"/>`;cum+=d.v});
  const pc=$('#pieChart');if(pc)pc.innerHTML=paths+`<circle cx="100" cy="100" r="45" fill="#fff"/><text x="100" y="95" text-anchor="middle" font-size="11" fill="#6B6878" font-weight="800">总支出</text><text x="100" y="112" text-anchor="middle" font-size="16" fill="#3A3845" font-weight="900" font-family="ZCOOL KuaiLe">¥${total}</text>`;
  const pl=$('#pieLegend');if(pl)pl.innerHTML=data.map(d=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line)"><span style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:800"><span style="width:10px;height:10px;border-radius:3px;background:${d.c}"></span>${d.n}</span><span style="font-weight:900;font-size:12px;color:var(--ink)">¥${d.v} · ${Math.round(d.v/total*100)}%</span></div>`).join('');
}
function renderLine(){
  const months=['2月','3月','4月','5月','6月','7月'];const income=[10500,11000,12200,11500,12800,12500];const expense=[7800,9200,6500,9800,7500,8219];
  const max=Math.max(...income,...expense)*1.15;const w=320,h=180,padL=30,padB=30,padT=10;const xStep=(w-padL-10)/(months.length-1);
  function pts(arr){return arr.map((v,i)=>`${padL+i*xStep},${h-padB-(v/max*(h-padB-padT))}`).join(' ')}
  const lc=$('#lineChart');if(!lc)return;
  lc.innerHTML=`<polyline points="${pts(income)}" fill="none" stroke="#1DD1A1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${pts(expense)}" fill="none" stroke="#EE5253" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><polyline points="${pts(income.map((v,i)=>v-expense[i]))}" fill="none" stroke="#54A0FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="4,3"/>${income.map((v,i)=>`<circle cx="${padL+i*xStep}" cy="${h-padB-(v/max*(h-padB-padT))}" r="3" fill="#1DD1A1"/>`).join('')}${expense.map((v,i)=>`<circle cx="${padL+i*xStep}" cy="${h-padB-(v/max*(h-padB-padT))}" r="3" fill="#EE5253"/>`).join('')}${months.map((m,i)=>`<text x="${padL+i*xStep}" y="${h-padB+14}" text-anchor="middle" font-size="9" fill="#A8A4B5" font-weight="800">${m}</text>`).join('')}`;
}

function exportData(){
  const data=JSON.stringify(DB,null,2);
  const blob=new Blob([data],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='萌趣工作台_数据备份_'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(url);
  toast('数据已导出为JSON文件📥');
}
function importData(){
  const input=document.createElement('input');input.type='file';input.accept='.json';
  input.onchange=e=>{const file=e.target.files[0];const reader=new FileReader();reader.onload=ev=>{try{const data=JSON.parse(ev.target.result);DB=data;saveDB();renderAll();toast('数据导入成功📥')}catch(err){toast('导入失败：文件格式错误')}};reader.readAsText(file)};
  input.click();
}

// ============ PWA 安装提示 ============
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();deferredPrompt=e;
  setTimeout(()=>{$('#installBanner').classList.add('show')},2000);
});
$('#installBtn').addEventListener('click',async()=>{
  if(deferredPrompt){deferredPrompt.prompt();const{outcome}=await deferredPrompt.userChoice;deferredPrompt=null;$('#installBanner').classList.remove('show');toast(outcome==='accepted'?'安装成功！🎉':'已取消安装')}
  else{toast('请使用浏览器菜单"添加到主屏幕"📲')}
});
$('#installClose').addEventListener('click',()=>{$('#installBanner').classList.remove('show')});
window.addEventListener('appinstalled',()=>{toast('安装成功！🎉');$('#installBanner').classList.remove('show')});

  });
}
